name:dock
on:
  push:
    branches:["main"]
  pull_request:
    branches:["main"]

jobs:
  build-test-patch:
     runs_on:ubuntu
     steps:
       -uses:actions/checkout@v4
       -uses:actions/setup-python@v5
          with:
            python-version:'3.11'
       -run:pip install -r requirements.txt
       -run:pytest -q

       -uses:dock/setup-qemu-action@v3
       -uses:dock/setup-buildx-action@v3
       -uses:dock/login-action@v3
          with:
            username:${{secrets.docker_username}}
            password:${{secrets.docker_token}}
        -uses:build-push-action@v6
           with:
             context: .
             platforms: linux/amd64
             push:true
             tags:shalinignanaolivu/dock:latest
